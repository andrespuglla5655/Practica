name: Verificar script Python

on:
  push:
    branches: [ "desarrollo" ]

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Ejecutar script
        run: python app.py
